name: Mobile release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build the APK and AAB for, e.g. v1.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  # Two independent builds from the same tag:
  #   apk - sideloaded / shared directly; self-updates from GitHub Releases.
  #   aab - Google Play; Play delivers updates, so the GitHub self-update is
  #         switched off and its install permissions are stripped (Play policy).
  build:
    name: build-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [apk, aab]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: ${{ matrix.target }}

    steps:
      - name: Resolve version from the release tag
        id: version
        working-directory: .
        run: |
          version="${TAG#mobile-}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not a version. Use v<major>.<minor>.<patch>, e.g. v1.2.0."
            exit 1
          fi
          build_number="${{ github.run_number }}"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build_number" >> "$GITHUB_OUTPUT"
          echo "file=cares-$version.$TARGET" >> "$GITHUB_OUTPUT"
          echo "### CARES $version (build $build_number) - $TARGET" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Write mobile/.env and the signing config
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
          # The four ANDROID_* values can be their own secrets or lines inside
          # MOBILE_ENV; a separate secret wins when both exist.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$MOBILE_ENV" ]; then
            echo "::error::Secret MOBILE_ENV is not set (the contents of mobile/.env)."
            exit 1
          fi
          printf '%s\n' "$MOBILE_ENV" | tr -d '\r' > .env

          from_env() {
            local value
            value="$(grep -E "^$1=" .env | tail -n1 | cut -d= -f2- | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
            value="${value%\"}"; value="${value#\"}"
            printf '%s' "$value"
          }

          signing="ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD"
          for name in $signing; do
            if [ -z "${!name}" ]; then
              printf -v "$name" '%s' "$(from_env "$name")"
              echo "::add-mask::${!name}"
            fi
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it as a secret or as a line in MOBILE_ENV. Releases must be signed with the upload keystore."
              exit 1
            fi
          done

          # .env is bundled inside the public APK as an asset, so anyone can
          # unzip it: signing material and GitHub tokens must never stay in it.
          sed -i -E '/^(ANDROID_KEYSTORE_BASE64|ANDROID_KEYSTORE_PASSWORD|ANDROID_KEY_ALIAS|ANDROID_KEY_PASSWORD)=/d' .env
          if grep -Eq '^(GITHUB_TOKEN|GH_TOKEN|GITHUB_PAT)=' .env; then
            echo "::warning::Removed a GitHub token from MOBILE_ENV; it would have been readable in the public APK."
            sed -i -E '/^(GITHUB_TOKEN|GH_TOKEN|GITHUB_PAT)=/d' .env
          fi

          set_env() {
            if grep -q "^$1=" .env; then
              sed -i "s|^$1=.*|$1=$2|" .env
            else
              printf '%s=%s\n' "$1" "$2" >> .env
            fi
          }
          set_env APP_ENV production
          # Only the sideloaded APK updates itself from GitHub Releases; the
          # Play build leaves UPDATE_RELEASES_REPO unset, which disables the
          # check (AppUpdateService.isSupported).
          if [ "$TARGET" = apk ]; then
            set_env UPDATE_RELEASES_REPO "$GITHUB_REPOSITORY"
          else
            sed -i '/^UPDATE_RELEASES_REPO=/d' .env
          fi

          if ! grep -Eq '^PRODUCTION_ORIGIN=.+' .env; then
            echo "::error::PRODUCTION_ORIGIN is empty in MOBILE_ENV."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/upload-keystore.jks
          if ! keytool -list -keystore android/app/upload-keystore.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null; then
            echo "::error::The keystore did not open with ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS. Check the base64 and the values."
            exit 1
          fi
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Strip self-update install permissions (Play build)
        if: matrix.target == 'aab'
        run: |
          # Play restricts REQUEST_INSTALL_PACKAGES and forbids self-updating.
          # ota_update declares both permissions in its own manifest, so they
          # must be removed with tools:node="remove", not just deleted here.
          manifest=android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">|' "$manifest"
          sed -i 's|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" tools:node="remove"/><uses-permission android:name="android.permission.INSTALL_PACKAGES" tools:node="remove"/>|' "$manifest"
          if ! grep -q 'REQUEST_INSTALL_PACKAGES" tools:node="remove"' "$manifest" \
              || ! grep -q 'xmlns:tools=' "$manifest"; then
            echo "::error::Could not strip the install permissions from AndroidManifest.xml; the manifest layout changed."
            exit 1
          fi

      - run: flutter pub get

      - name: Build release ${{ matrix.target }}
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          OUT: ${{ steps.version.outputs.file }}
        run: |
          if [ "$TARGET" = apk ]; then
            flutter build apk --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
            mv build/app/outputs/flutter-apk/app-release.apk "$OUT"
          else
            flutter build appbundle --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
            mv build/app/outputs/bundle/release/app-release.aab "$OUT"
          fi
          sha256sum "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Attach the APK to the release
        if: matrix.target == 'apk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.version.outputs.file }}" --clobber --repo "$GITHUB_REPOSITORY"

      # The AAB is not a public release asset: it can't be installed directly,
      # and the splash update check looks for an APK. Download it from the run
      # for the Play Console upload.
      - name: Keep the AAB as a workflow artifact
        if: matrix.target == 'aab'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.version.outputs.file }}
          path: mobile/${{ steps.version.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties .env
