services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: local_server
    ports:
      - '9000:9000'
    env_file:
      - ./.env
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules

  db:
    image: pgvector/pgvector:pg15
    container_name: postgres_db
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${DATABASE_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - db

  fr-service:
    build:
      context: ./microservices/fr-service
      dockerfile: Dockerfile
    container_name: fr_service
    ports:
      - '8001:8001'
    environment:
      - PORT=8001
      - MODEL_NAME=buffalo_l
      - CTX_ID=-1
      - DET_SIZE=640
      - VERIFY_THRESHOLD=0.4
      - EMBEDDING_DIM=512
      - CORS_ORIGINS=*

volumes:
  postgres_data:
  redis_data:
